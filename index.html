<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Айсель</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #ff9a9e 0%, #fad0c4 45%, #fbc2eb 100%);
      font-family: system-ui, sans-serif;
    }
    #hearts { position: fixed; inset: 0; pointer-events: none; }

    .heart {
      position: absolute;
      bottom: -60px;
      user-select: none;
      animation: rise linear forwards;
      will-change: transform, opacity;
    }
    @keyframes rise {
      0%   { transform: translate(0, 0) rotate(0deg) scale(var(--s)); opacity: 0; }
      10%  { opacity: 1; }
      100% { transform: translate(var(--dx), -115vh) rotate(var(--r)) scale(var(--s)); opacity: 0; }
    }

    .burst {
      position: absolute;
      left: 50%; top: 50%;
      animation: burst 1.4s ease-out forwards;
    }
    @keyframes burst {
      0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2); opacity: 0; }
    }

    .center {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 16px;
      z-index: 2;
    }
    #name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(56px, 16vw, 120px);
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 60, 120, .8), 0 4px 12px rgba(180, 0, 60, .4);
      opacity: 0;
      transform: scale(.6);
      animation: appear 1.6s cubic-bezier(.2, 1.4, .4, 1) .4s forwards,
                 pulse 1.8s ease-in-out 2s infinite;
    }
    @keyframes appear { to { opacity: 1; transform: scale(1); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.07); }
    }
    #sub {
      margin-top: 12px;
      color: #fff;
      font-size: 18px;
      opacity: 0;
      animation: fade 1s ease 1.8s forwards;
      text-shadow: 0 1px 6px rgba(180, 0, 60, .5);
    }
    @keyframes fade { to { opacity: .9; } }
  </style>
</head>
<body>
  <div id="hearts"></div>
  <div class="center">
    <div id="name">Айсель</div>
    <div id="sub">✝ Нажми на экран ✝</div>
  </div>

  <script>
    // ==== НАСТРОЙКА: впиши сюда имя. Если пусто — возьмётся имя пользователя Telegram ====
    const NAME = "Айсель";

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const tgName = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name;
    const urlName = new URLSearchParams(location.search).get('name');
    document.getElementById('name').textContent = NAME || urlName || tgName || 'Любимая';

    const box = document.getElementById('hearts');
    // Логотип TikTok (нота с голубой и красной тенью на чёрном фоне)
    const NOTE = 'M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z';
    const TIKTOK = `<svg width="1em" height="1em" viewBox="-6 -6 36 36">
      <rect x="-6" y="-6" width="36" height="36" rx="8" fill="#000"/>
      <path d="${NOTE}" fill="#25F4EE" transform="translate(-.8 -.8)"/>
      <path d="${NOTE}" fill="#FE2C55" transform="translate(.8 .8)"/>
      <path d="${NOTE}" fill="#fff"/>
    </svg>`;

    // Иисус: нимб, волосы, лицо, борода, одеяние
    const JESUS = `<svg width="1em" height="1em" viewBox="0 0 64 64">
      <circle cx="32" cy="24" r="21" fill="#FFD54A" opacity=".9"/>
      <circle cx="32" cy="24" r="21" fill="none" stroke="#F2A900" stroke-width="2"/>
      <path d="M8 64c2-14 12-20 24-20s22 6 24 20z" fill="#fff"/>
      <path d="M20 64c2-10 6-16 12-16s10 6 12 16z" fill="#C62828"/>
      <path d="M17 26c0-11 7-17 15-17s15 6 15 17v14c0 4-3 6-6 6H23c-3 0-6-2-6-6z" fill="#6D4C41"/>
      <ellipse cx="32" cy="27" rx="10" ry="12" fill="#F1C9A5"/>
      <path d="M22 30c1 9 5 14 10 14s9-5 10-14c-2 3-5 4-10 4s-8-1-10-4z" fill="#6D4C41"/>
      <circle cx="28" cy="26" r="1.3" fill="#3E2723"/>
      <circle cx="36" cy="26" r="1.3" fill="#3E2723"/>
      <path d="M29 34.5q3 1.5 6 0" stroke="#3E2723" stroke-width="1" fill="none" stroke-linecap="round"/>
    </svg>`;

    const EMOJI = ['✝️', '✞', '☦️', '✝️', TIKTOK, TIKTOK, JESUS, JESUS];
    const rnd = (a, b) => a + Math.random() * (b - a);

    function spawnHeart() {
      const h = document.createElement('span');
      h.className = 'heart';
      h.innerHTML = EMOJI[Math.floor(Math.random() * EMOJI.length)];
      h.style.left = rnd(0, 100) + 'vw';
      h.style.fontSize = rnd(16, 42) + 'px';
      h.style.setProperty('--s', rnd(.7, 1.3));
      h.style.setProperty('--dx', rnd(-80, 80) + 'px');
      h.style.setProperty('--r', rnd(-60, 60) + 'deg');
      h.style.animationDuration = rnd(4, 9) + 's';
      box.appendChild(h);
      h.addEventListener('animationend', () => h.remove());
    }

    function burst(x, y, count = 14) {
      for (let i = 0; i < count; i++) {
        const b = document.createElement('span');
        b.className = 'burst';
        b.innerHTML = EMOJI[Math.floor(Math.random() * EMOJI.length)];
        b.style.left = x + 'px';
        b.style.top = y + 'px';
        b.style.fontSize = rnd(18, 34) + 'px';
        const a = (Math.PI * 2 * i) / count;
        const d = rnd(80, 180);
        b.style.setProperty('--x', Math.cos(a) * d + 'px');
        b.style.setProperty('--y', Math.sin(a) * d + 'px');
        box.appendChild(b);
        b.addEventListener('animationend', () => b.remove());
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    // Стартовый взрыв сердечек + постоянный поток
    for (let i = 0; i < 25; i++) setTimeout(spawnHeart, i * 80);
    setTimeout(() => burst(innerWidth / 2, innerHeight / 2, 20), 500);
    setInterval(spawnHeart, 220);

    document.addEventListener('pointerdown', e => burst(e.clientX, e.clientY));
  </script>
</body>
</html>
